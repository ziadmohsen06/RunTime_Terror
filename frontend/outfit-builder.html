<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build an Outfit</title>
  <link rel="stylesheet" href="outfits.css">
</head>

<body>
  <h1>Build an Outfit</h1>
  <nav>
    <a href="index.html">My Closet</a>
    <a href="outfit-builder.html" aria-current="page">Build an Outfit</a>
    <a href="outfit-suggestions.html">Outfit Suggestions</a>
  </nav>

  <section>
    <h2>Pick your items</h2>
    <p class="muted">Only clean items can be used.</p>

    <form id="outfitForm">
      <label for="outfitName">Outfit name *</label>
      <input id="outfitName" type="text" required placeholder="e.g. Friday at work">

      <div id="itemChoices" class="item-grid"></div>

      <button type="submit" id="saveButton" disabled>Save outfit</button>
    </form>

    <p id="message" role="status"></p>
  </section>

  <section>
    <h2>Saved outfits</h2>
    <div id="savedOutfits"></div>
  </section>

  <script>
    const form = document.getElementById('outfitForm');
    const nameInput = document.getElementById('outfitName');
    const itemChoices = document.getElementById('itemChoices');
    const saveButton = document.getElementById('saveButton');
    const savedOutfits = document.getElementById('savedOutfits');
    const message = document.getElementById('message');

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError ? 'error' : '';
    }

    function textElement(tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      return element;
    }

    async function readJson(response) {
      const body = await response.json();
      if (!response.ok) throw new Error(body.error?.message || 'Something went wrong');
      return body;
    }

    function selectedIds() {
      return [...itemChoices.querySelectorAll('input:checked')].map((box) => Number(box.value));
    }

    function updateSaveButton() {
      const count = selectedIds().length;
      saveButton.disabled = count === 0;
      saveButton.textContent = count === 0
        ? 'Save outfit'
        : `Save outfit (${count} item${count === 1 ? '' : 's'})`;
    }

    function itemChoice(item) {
      const label = document.createElement('label');
      label.className = 'item-choice';

      const box = document.createElement('input');
      box.type = 'checkbox';
      box.value = item.id;

      const text = document.createElement('div');
      text.append(
        textElement('strong', item.name),
        textElement('span', `${item.category}, ${item.color}, ${item.season}`)
      );

      label.append(box, text);
      return label;
    }

    async function loadItems() {
      const items = await readJson(await fetch('/items?status=clean'));
      itemChoices.replaceChildren(...items.map(itemChoice));
      if (items.length === 0) {
        itemChoices.append(textElement('p', 'No clean items yet. Add some in My Closet.', 'muted'));
      }
      updateSaveButton();
    }

    function outfitCard(outfit) {
      const card = textElement('div', '', 'card');
      card.append(textElement('h3', outfit.name));

      const list = document.createElement('ul');
      list.append(...outfit.items.map((item) => textElement('li', item.name)));
      card.append(list);

      const notClean = outfit.items.filter((item) => item.status !== 'clean');
      if (notClean.length > 0) {
        const names = notClean.map((item) => item.name).join(', ');
        card.append(textElement('p', `Not clean right now: ${names}`, 'warning'));
      }
      return card;
    }

    async function loadOutfits() {
      const outfits = await readJson(await fetch('/outfits'));
      savedOutfits.replaceChildren(...outfits.map(outfitCard));
      if (outfits.length === 0) {
        savedOutfits.append(textElement('p', 'No saved outfits yet.', 'muted'));
      }
    }

    itemChoices.addEventListener('change', updateSaveButton);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      showMessage('');
      try {
        const outfit = await readJson(await fetch('/outfits', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: nameInput.value, itemIds: selectedIds() }),
        }));
        showMessage(`Saved "${outfit.name}".`);
        form.reset();
      } catch (error) {
        showMessage(error.message, true);
      }
      // Reloading also clears any item that stopped being clean after the page opened.
      await Promise.all([loadItems(), loadOutfits()]);
    });

    Promise.all([loadItems(), loadOutfits()]).catch((error) => showMessage(error.message, true));
  </script>
</body>
</html>
