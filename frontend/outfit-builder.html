<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build an Outfit</title>

  <link rel="stylesheet" href="theme.css">
  <script src="auth.js"></script>
  <script src="shell.js"></script>
  <script src="outfit-builder.js" defer></script>

  <style>
    /* Scoped to this page: groups the item picker by slot, the way a real outfit is built. */
    .slot-group { margin-bottom: 16px; }
    .slot-group h3 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .item-choice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 140ms ease-out, background-color 140ms ease-out;
    }
    .item-choice:hover { background: var(--nav-hover); }
    .item-choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft-bg); }
    .item-choice input { width: auto; flex: none; }
    .item-choice .grow { flex: 1 1 auto; min-width: 0; }
  </style>
</head>

<body>
  <main class="main">
    <h1>Build an outfit</h1>
    <p class="muted">Pick your own clean items and save a look. Occasion and season are optional tags for later.</p>
    <p><a href="outfit-suggestions.html">Prefer ranked suggestions instead?</a> · <a href="ironing.html">Go to ironing queue</a></p>

    <section class="card static">
      <h2>New outfit</h2>

      <form id="outfitForm">
        <div class="form-grid">
          <div>
            <label for="outfitName">Outfit name *</label>
            <input id="outfitName" type="text" required placeholder="e.g. Friday at work">
          </div>

          <div>
            <label for="outfitOccasion">Occasion (optional)</label>
            <select id="outfitOccasion">
              <option value="">Any</option>
              <option value="casual">Casual</option>
              <option value="work">Work</option>
              <option value="formal">Formal</option>
              <option value="sport">Sport</option>
            </select>
          </div>

          <div>
            <label for="outfitSeason">Season (optional)</label>
            <select id="outfitSeason">
              <option value="">Any</option>
              <option value="spring">Spring</option>
              <option value="summer">Summer</option>
              <option value="autumn">Autumn</option>
              <option value="winter">Winter</option>
            </select>
          </div>
        </div>

        <p class="muted">Only clean items can go into an outfit — dirty or ironing items are left out here.</p>
        <div id="itemChoices"></div>

        <button type="submit" class="btn" id="saveButton" disabled>Save outfit</button>
      </form>

      <p id="formMessage" role="status" aria-live="polite"></p>
    </section>

    <section class="card static">
      <h2>Saved outfits</h2>
      <div id="savedOutfits" class="card-grid"></div>
    </section>
  </main>
</body>
</html>
