
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closet Items - Test Page</title>
  <link rel="stylesheet" href="theme.css">
  <script src="auth.js"></script>
  <script src="shell.js"></script>
</head>

<body>
  <noscript>
    <nav class="noscript-nav">
      <a href="index.html">Closet</a>
      <a href="outfit-builder.html">Outfits</a>
      <a href="laundry.html">Laundry</a>
      <a href="ironing.html">Ironing</a>
      <a href="wear-log.html">Wear log</a>
      <a href="recurring.html">Recurring tasks</a>
    </nav>
  </noscript>
  <main class="main">
  <h1>My Closet</h1>
  <p class="muted">Add clothing and filter what you own.</p>

  <section class="card static">
    <h2>Add a clothing item</h2>

    <form id="itemForm">
      <div class="form-grid">
        <div>
          <label for="name">Item name *</label>
          <input id="name" required placeholder="e.g. White T-shirt">
        </div>

        <div>
          <label for="category">Category *</label>
          <input id="category" required placeholder="e.g. Tops">
        </div>

        <div>
          <label for="color">Color *</label>
          <input id="color" required placeholder="e.g. White">
        </div>

        <div>
          <label for="season">Season *</label>
          <select id="season" required>
            <option value="">Choose season</option>
            <option>Spring</option>
            <option>Summer</option>
            <option>Autumn</option>
            <option>Winter</option>
            <option>All Season</option>
          </select>
        </div>

        <div>
          <label for="fabric">Fabric *</label>
          <input id="fabric" required placeholder="e.g. Cotton">
        </div>

        <div>
          <label for="photoUrl">Photo URL (optional)</label>
          <input id="photoUrl" type="url" placeholder="https://...">
        </div>
      </div>

      <button type="submit" class="btn" id="addButton">Add Item</button>
    </form>

    <p id="message" role="status"></p>
  </section>

  <section class="card static">
    <h2>My items</h2>

    <div class="form-grid filters">
      <div>
        <label for="filterCategory">Filter by category</label>
        <input id="filterCategory" placeholder="e.g. Tops">
      </div>

      <div>
        <label for="filterColor">Filter by color</label>
        <input id="filterColor" placeholder="e.g. White">
      </div>

      <div>
        <label for="filterSeason">Filter by season</label>
        <input id="filterSeason" placeholder="e.g. Summer">
      </div>

      <div>
        <label for="filterStatus">Filter by status</label>
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option value="clean">Clean</option>
          <option value="dirty">Dirty</option>
          <option value="in_laundry">In laundry</option>
          <option value="washing">Washing</option>
          <option value="drying">Drying</option>
          <option value="ironing">Ironing</option>
        </select>
      </div>
    </div>

    <button type="button" class="btn" id="filterButton">Apply filters</button>
    <button type="button" class="btn btn-secondary" id="clearButton">Clear filters</button>

    <p id="itemCount" class="muted num mt">Loading items...</p>
    <div id="itemsList" class="card-grid"></div>
  </section>
  </main>

  <script>
    const form = document.getElementById('itemForm');
    const message = document.getElementById('message');
    const itemsList = document.getElementById('itemsList');
    const itemCount = document.getElementById('itemCount');

    // One message that fills the whole grid: used for loading, empty and error states.
    function showState(text, loading) {
      const state = document.createElement('div');
      state.className = 'state';
      state.style.gridColumn = '1 / -1';
      if (loading) {
        const spinner = document.createElement('span');
        spinner.className = 'spinner';
        state.appendChild(spinner);
      }
      state.appendChild(document.createTextNode(text));
      itemsList.replaceChildren(state);
    }

    async function loadItems() {
      itemCount.textContent = 'Loading items...';
      showState('Loading items...', true);

      const params = new URLSearchParams();

      const filters = {
        category: document.getElementById('filterCategory').value.trim(),
        color: document.getElementById('filterColor').value.trim(),
        season: document.getElementById('filterSeason').value.trim(),
        status: document.getElementById('filterStatus').value
      };

      for (const [key, value] of Object.entries(filters)) {
        if (value) params.append(key, value);
      }

      try {
        const response = await authFetch('/items?' + params.toString());

        if (!response.ok) {
          throw new Error('Could not load items. HTTP ' + response.status);
        }

        const items = await response.json();

        itemCount.textContent = items.length + ' item(s) found';

        if (items.length === 0) {
          showState('No items found. Try adding an item!');
          return;
        }

        itemsList.replaceChildren();

        for (const item of items) {
          const card = document.createElement('div');
          card.className = 'card';

          const title = document.createElement('h3');
          title.textContent = item.name;
          card.appendChild(title);
          card.appendChild(Shell.statusChip(item.status));

          const details = [
            'Category: ' + item.category,
            'Color: ' + item.color,
            'Season: ' + item.season,
            'Fabric: ' + item.fabric,
            'ID: ' + item.id
          ];

          for (const detail of details) {
            const paragraph = document.createElement('p');
            paragraph.textContent = detail;
            paragraph.className = 'num';
            card.appendChild(paragraph);
          }

          if (item.photoUrl) {
            const link = document.createElement('a');
            link.href = item.photoUrl;
            link.textContent = 'View photo';
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            card.appendChild(link);
          }

          itemsList.appendChild(card);
        }
      } catch (error) {
        itemCount.textContent = 'Could not load items.';
        showState(error.message + ' Make sure the backend is running.');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Adding item...';

      const item = {
        name: document.getElementById('name').value.trim(),
        category: document.getElementById('category').value.trim(),
        color: document.getElementById('color').value.trim(),
        season: document.getElementById('season').value,
        fabric: document.getElementById('fabric').value.trim()
      };

      const photoUrl = document.getElementById('photoUrl').value.trim();
      if (photoUrl) item.photoUrl = photoUrl;

      try {
        const response = await authFetch('/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(item)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error((result.error && result.error.message) || 'Could not add item.');
        }

        message.textContent = 'Item added successfully!';
        Shell.toast('Item added', 'success');

        form.reset();
        await loadItems();
      } catch (error) {
        message.textContent = 'Error: ' + error.message;
      }
    });

    document.getElementById('filterButton').addEventListener('click', loadItems);

    document.getElementById('clearButton').addEventListener('click', () => {
      document.getElementById('filterCategory').value = '';
      document.getElementById('filterColor').value = '';
      document.getElementById('filterSeason').value = '';
      document.getElementById('filterStatus').value = '';
      loadItems();
    });

    loadItems();
  </script>
</body>
</html>
