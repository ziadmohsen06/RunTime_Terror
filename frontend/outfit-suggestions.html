<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outfit Suggestions</title>

  <link rel="stylesheet" href="theme.css">
  <script src="auth.js"></script>
  <script src="shell.js"></script>
  <script src="outfit-suggestions.js" defer></script>

  <style>
    /* Scoped to this page: the per-rule score breakdown bar under each suggestion. */
    .score-bars { display: flex; gap: 14px; margin-top: 10px; }
    .score-bar { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .score-bar .label {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em;
    }
    .score-bar .track { background: var(--nav-hover); border-radius: 999px; height: 5px; overflow: hidden; }
    .score-bar .fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 200ms ease-out; }
  </style>
</head>

<body>
  <main class="main">
    <h1>Outfit suggestions</h1>
    <p class="muted">Ranked by occasion, season and color match — clean items only.</p>
    <p><a href="outfit-builder.html">Build your own outfit instead</a> · <a href="ironing.html">Go to ironing queue</a></p>

    <section class="card static">
      <h2>What's the plan?</h2>

      <div class="chip-row" id="occasionChips" aria-label="Choose an occasion">
        <button type="button" class="chip" data-occasion="casual">Casual</button>
        <button type="button" class="chip" data-occasion="work">Work</button>
        <button type="button" class="chip" data-occasion="formal">Formal</button>
        <button type="button" class="chip" data-occasion="sport">Sport</button>
      </div>

      <div class="chip-row" id="seasonChips" aria-label="Choose a season">
        <button type="button" class="chip" data-season="spring">Spring</button>
        <button type="button" class="chip" data-season="summer">Summer</button>
        <button type="button" class="chip" data-season="autumn">Autumn</button>
        <button type="button" class="chip" data-season="winter">Winter</button>
      </div>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card static">
      <h2>Ranked for <span id="contextLabel"></span></h2>
      <div id="results" class="card-grid"></div>
    </section>
  </main>
</body>
</html>
